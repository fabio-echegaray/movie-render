[DATA]
image = ./20231122 - JupMCh SqhGFP/CHX_500ug_1/CHX_500ug_1_MMStack_Default.ome.tif
frames = 0..5
channel = all
override_dt = 10

[CHANNEL-1]
name = 01-green
color = (1, 0, 1, 0) # green
histogram = yes
rescale_min = 5500
rescale_max = 16000

[CHANNEL-2]
name = 02-red
color = (1, 1, 0, 0) # red
histogram = yes
rescale_min = 5400
rescale_max = 16000

[OVERLAY-01]
id = arrow_001
type = arrow
xy = (10,10)
length = 30
angle = 30
color = white

[MOVIE-1]
title = Overlay Demo
description = Shows overlays in the rendering of a movie.
fps = 10
layout = two-ch
zstack = all-max
overlays = [arrow_001,]
filename = movie-overlays

[PANEL-01]
title = Overlay Demo
description = Shows overlays in the rendering of a panel.
frames = [0,5,10,15]
zstack = 2..5
type = all-frames
layout = all-frames
columns = frames
rows = channel
max_columns = 8
height = 1
scalebar = 10
scalebar_thickness = 1
draw_scalebar_text = no
timestamp_format = mm:ss
draw_frame_in_timestamp = no
fontsize = 7
channel_1_color = red
channel_2_color = cyan
overlays = [arrow_001,]
filename = panel-overlays
