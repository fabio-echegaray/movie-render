  <!-- ============ RELATIONSHIPS ============ -->

  <!-- BaseLayoutComposer creates MovieRenderer -->
  <path d="M 970 440 L 980 440 L 980 132 L 980 132" stroke="#8e44ad" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="988" y="280" font-size="8" fill="#8e44ad" transform="rotate(-90, 988, 280)">creates</text>

  <!-- MovieRenderer uses ImagePipeline -->
  <path d="M 850 175 L 850 200" stroke="#27ae60" stroke-width="1.5" fill="none" marker-end="url(#diamond)"/>
  <text x="860" y="192" font-size="8" fill="#27ae60">has *</text>

  <!-- MovieRenderer uses Overlay -->
  <path d="M 720 132 L 560 132" stroke="#f39c12" stroke-width="1.5" fill="none" marker-end="url(#diamond)"/>
  <text x="620" y="125" font-size="8" fill="#f39c12">has *</text>

