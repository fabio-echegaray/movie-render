  <text x="1210" y="268" font-size="8" fill="#3498db">reads config</text>

  <!-- Plugins produce Config -->
  <path d="M 1080 340 L 280 132" stroke="#2980b9" stroke-width="1" fill="none" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <text x="600" y="220" font-size="8" fill="#2980b9">produces ConfigMovie/Panel</text>

  <!-- Config used by Layouts -->
  <path d="M 280 170 L 730 450" stroke="#8e44ad" stroke-width="1" fill="none" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <text x="450" y="330" font-size="8" fill="#8e44ad" transform="rotate(30, 450, 330)">ConfigMovie input</text>

  <!-- PipelineException used by ImagePipeline -->
  <path d="M 880 217 L 860 217" stroke="#c0392b" stroke-width="1" fill="none" stroke-dasharray="3" marker-end="url(#arrow)"/>
  <text x="868" y="210" font-size="7" fill="#c0392b">throws</text>

