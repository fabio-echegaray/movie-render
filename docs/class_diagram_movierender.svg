    </marker>
  </defs>

  <!-- Title -->
  <text x="700" y="30" text-anchor="middle" font-size="18" font-weight="bold">MovieRender - Class Diagram</text>

  <!-- ============ CONFIG MODULE ============ -->
  <rect x="30" y="50" width="250" height="130" rx="8" fill="#e8f4f8" stroke="#2980b9" stroke-width="2"/>
  <text x="155" y="72" text-anchor="middle" font-weight="bold" font-size="13" fill="#2c3e50">ConfigModule</text>
