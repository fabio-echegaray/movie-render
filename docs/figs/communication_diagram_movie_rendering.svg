<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" font-family="monospace" font-size="12">
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrow3r" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="700" y="30" text-anchor="middle" font-size="18" font-weight="bold">Communication Diagram: Movie Rendering Flow</text>
  <text x="700" y="50" text-anchor="middle" font-size="11" fill="#666">Sequence of object interactions when rendering a movie from a .cfg file</text>

  <!-- ============ LIFELINES ============ -->
  <!-- Vertical dashed lines for each object -->

  <!-- 1. CLI / Typer App -->
  <rect x="50" y="70" width="120" height="30" rx="5" fill="#fde8e8" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="110" y="90" text-anchor="middle" font-size="10" font-weight="bold">CLI (Typer)</text>
  <line x1="110" y1="100" x2="110" y2="960" stroke="#e74c3c" stroke-width="1" stroke-dasharray="4"/>

  <!-- 2. fileops.read_config -->
  <rect x="210" y="70" width="140" height="30" rx="5" fill="#f0f4ff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="280" y="90" text-anchor="middle" font-size="10" font-weight="bold">fileops.read_config</text>
  <line x1="280" y1="100" x2="280" y2="960" stroke="#2c3e50" stroke-width="1" stroke-dasharray="4"/>

  <!-- 3. MovieHeaderReaderPlugin -->
  <rect x="390" y="70" width="180" height="30" rx="5" fill="#e8e8f8" stroke="#3498db" stroke-width="1.5"/>
  <text x="480" y="90" text-anchor="middle" font-size="10" font-weight="bold">MovieHeaderReaderPlugin</text>
  <line x1="480" y1="100" x2="480" y2="960" stroke="#3498db" stroke-width="1" stroke-dasharray="4"/>

  <!-- 4. ConfigMovie -->
  <rect x="610" y="70" width="120" height="30" rx="5" fill="#e8f4f8" stroke="#2980b9" stroke-width="1.5"/>
  <text x="670" y="90" text-anchor="middle" font-size="10" font-weight="bold">ConfigMovie</text>
  <line x1="670" y1="100" x2="670" y2="960" stroke="#2980b9" stroke-width="1" stroke-dasharray="4"/>

  <!-- 5. LayoutComposer -->
  <rect x="770" y="70" width="170" height="30" rx="5" fill="#f3e8f8" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="855" y="90" text-anchor="middle" font-size="10" font-weight="bold">LayoutComposer</text>
  <line x1="855" y1="100" x2="855" y2="960" stroke="#8e44ad" stroke-width="1" stroke-dasharray="4"/>

  <!-- 6. MovieRenderer -->
  <rect x="980" y="70" width="160" height="30" rx="5" fill="#e8f8e8" stroke="#27ae60" stroke-width="1.5"/>
  <text x="1060" y="90" text-anchor="middle" font-size="10" font-weight="bold">MovieRenderer</text>
  <line x1="1060" y1="100" x2="1060" y2="960" stroke="#27ae60" stroke-width="1" stroke-dasharray="4"/>

  <!-- 7. ImagePipeline -->
  <rect x="1180" y="70" width="160" height="30" rx="5" fill="#e8f8e8" stroke="#16a085" stroke-width="1.5"/>
  <text x="1260" y="90" text-anchor="middle" font-size="10" font-weight="bold">ImagePipeline</text>
  <line x1="1260" y1="100" x2="1260" y2="960" stroke="#16a085" stroke-width="1" stroke-dasharray="4"/>

  <!-- ============ MESSAGES ============ -->

  <!-- Step 1: User runs CLI -->
  <text x="15" y="135" font-weight="bold" fill="#e74c3c">1</text>
  <rect x="40" y="120" width="140" height="25" rx="3" fill="#fff3e0" stroke="#e67e22"/>
  <text x="110" y="137" text-anchor="middle" font-size="9">$ movierender movie config.cfg</text>

  <!-- Step 2: CLI calls read_config -->
  <text x="15" y="180" font-weight="bold" fill="#e74c3c">2</text>
  <line x1="110" y1="175" x2="270" y2="175" stroke="#333" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="190" y="168" text-anchor="middle" font-size="9">read_config(cfg_path)</text>

  <!-- Step 3: read_config invokes plugin -->
  <text x="15" y="225" font-weight="bold" fill="#e74c3c">3</text>
  <line x1="280" y1="220" x2="470" y2="220" stroke="#333" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="375" y="213" text-anchor="middle" font-size="9">has_valid_header()</text>

  <!-- Step 4: Plugin processes config -->
  <text x="15" y="270" font-weight="bold" fill="#e74c3c">4</text>
  <line x1="280" y1="265" x2="470" y2="265" stroke="#333" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="375" y="258" text-anchor="middle" font-size="9">process()</text>

  <!-- Step 5: Plugin returns ConfigMovie -->
  <text x="15" y="310" font-weight="bold" fill="#e74c3c">5</text>
  <line x1="470" y1="305" x2="290" y2="305" stroke="#2980b9" stroke-width="1.5" marker-end="url(#arrow3r)"/>
  <text x="380" y="298" text-anchor="middle" font-size="9" fill="#2980b9">List[ConfigMovie]</text>

  <!-- Step 6: read_config returns to CLI -->
  <text x="15" y="350" font-weight="bold" fill="#e74c3c">6</text>
  <line x1="270" y1="345" x2="120" y2="345" stroke="#2980b9" stroke-width="1.5" marker-end="url(#arrow3r)"/>
  <text x="195" y="338" text-anchor="middle" font-size="9" fill="#2980b9">config with .movies</text>

  <!-- Step 7: CLI calls render_movie -->
  <text x="15" y="395" font-weight="bold" fill="#e74c3c">7</text>
  <line x1="110" y1="390" x2="845" y2="390" stroke="#8e44ad" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="480" y="383" text-anchor="middle" font-size="9">render_movie(configMovie, overwrite, test)</text>

  <!-- Step 8: LayoutComposer selects layout -->
  <text x="15" y="440" font-weight="bold" fill="#e74c3c">8</text>
  <rect x="770" y="420" width="170" height="25" rx="3" fill="#f3e8f8" stroke="#8e44ad"/>
  <text x="855" y="437" text-anchor="middle" font-size="9">LayoutCompositeComposer(movie)</text>

  <!-- Step 9: LayoutComposer creates MovieRenderer -->
  <text x="15" y="490" font-weight="bold" fill="#e74c3c">9</text>
  <line x1="855" y1="485" x2="1050" y2="485" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="952" y="478" text-anchor="middle" font-size="9">MovieRenderer(fig, config)</text>

  <!-- Step 10: LayoutComposer adds overlays -->
  <text x="15" y="535" font-weight="bold" fill="#e74c3c">10</text>
  <line x1="855" y1="530" x2="1050" y2="530" stroke="#f39c12" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="952" y="523" text-anchor="middle" font-size="9" fill="#f39c12">renderer += ScaleBar(...)</text>

  <!-- Step 11: LayoutComposer adds ImagePipeline -->
  <text x="15" y="575" font-weight="bold" fill="#e74c3c">11</text>
  <line x1="855" y1="570" x2="1050" y2="570" stroke="#16a085" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="952" y="563" text-anchor="middle" font-size="9" fill="#16a085">renderer += CompositeRGBImage(ax, zstack)</text>

  <!-- Step 12: LayoutComposer calls make_layout -->
  <text x="15" y="620" font-weight="bold" fill="#e74c3c">12</text>
  <rect x="770" y="605" width="170" height="20" rx="3" fill="#f3e8f8" stroke="#8e44ad"/>
  <text x="855" y="618" text-anchor="middle" font-size="9">make_layout() -- adds pending overlays</text>

  <!-- Step 13: LayoutComposer calls render -->
  <text x="15" y="665" font-weight="bold" fill="#e74c3c">13</text>
  <line x1="855" y1="660" x2="1050" y2="660" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="952" y="653" text-anchor="middle" font-size="9">renderer.render(filename)</text>

  <!-- Step 14: MovieRenderer iterates frames -->
  <text x="15" y="710" font-weight="bold" fill="#e74c3c">14</text>
  <rect x="980" y="695" width="160" height="20" rx="3" fill="#e8f8e8" stroke="#27ae60"/>
  <text x="1060" y="708" text-anchor="middle" font-size="9">for frame in config.frames:</text>

  <!-- Step 15: MovieRenderer calls ImagePipeline -->
  <text x="15" y="755" font-weight="bold" fill="#e74c3c">15</text>
  <line x1="1060" y1="750" x2="1250" y2="750" stroke="#16a085" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="1155" y="743" text-anchor="middle" font-size="9">pipeline()</text>

  <!-- Step 16: ImagePipeline returns image -->
  <text x="15" y="795" font-weight="bold" fill="#e74c3c">16</text>
  <line x1="1250" y1="790" x2="1070" y2="790" stroke="#16a085" stroke-width="1.5" marker-end="url(#arrow3r)"/>
  <text x="1160" y="783" text-anchor="middle" font-size="9" fill="#16a085">numpy image array</text>

  <!-- Step 17: MovieRenderer displays image -->
  <text x="15" y="835" font-weight="bold" fill="#e74c3c">17</text>
  <rect x="980" y="820" width="160" height="20" rx="3" fill="#e8f8e8" stroke="#27ae60"/>
  <text x="1060" y="833" text-anchor="middle" font-size="9">ax.imshow(img)</text>

  <!-- Step 18: MovieRenderer calls Overlay.plot() -->
  <text x="15" y="875" font-weight="bold" fill="#e74c3c">18</text>
  <line x1="1060" y1="870" x2="855" y2="870" stroke="#f39c12" stroke-width="1.5" marker-end="url(#arrow3r)"/>
  <text x="957" y="863" text-anchor="middle" font-size="9" fill="#f39c12">overlay.plot(ax, **kwargs)</text>

  <!-- Step 19: MovieRenderer saves frame -->
  <text x="15" y="915" font-weight="bold" fill="#e74c3c">19</text>
  <rect x="980" y="900" width="160" height="20" rx="3" fill="#e8f8e8" stroke="#27ae60"/>
  <text x="1060" y="913" text-anchor="middle" font-size="9">fig.savefig(frame.png)</text>

  <!-- Step 20: MovieRenderer assembles video -->
  <text x="15" y="955" font-weight="bold" fill="#e74c3c">20</text>
  <rect x="980" y="940" width="160" height="20" rx="3" fill="#e8f8e8" stroke="#27ae60"/>
  <text x="1060" y="953" text-anchor="middle" font-size="9">mpy.VideoClip --&gt; .mp4</text>

  <!-- ============ LEGEND ============ -->
  <rect x="30" y="700" width="280" height="120" rx="5" fill="#f9f9f9" stroke="#ccc" stroke-width="1"/>
  <text x="40" y="718" font-weight="bold" font-size="11">Legend</text>
  <line x1="40" y1="735" x2="100" y2="735" stroke="#333" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="110" y="739" font-size="9">Synchronous call</text>
  <line x1="40" y1="755" x2="100" y2="755" stroke="#2980b9" stroke-width="1.5" marker-end="url(#arrow3r)"/>
  <text x="110" y="759" font-size="9">Return value</text>
  <line x1="40" y1="775" x2="100" y2="775" stroke="#333" stroke-width="1" stroke-dasharray="4"/>
  <text x="110" y="779" font-size="9">Lifeline</text>
  <rect x="40" y="790" width="15" height="10" rx="2" fill="#fff3e0" stroke="#e67e22"/>
  <text x="65" y="799" font-size="9">User action</text>
  <rect x="160" y="790" width="15" height="10" rx="2" fill="#f3e8f8" stroke="#8e44ad"/>
  <text x="185" y="799" font-size="9">Internal process</text>
</svg>