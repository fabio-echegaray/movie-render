<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" font-family="monospace" font-size="12">
  <defs>
    <marker id="a5" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="a5r" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="700" y="30" text-anchor="middle" font-size="18" font-weight="bold">Communication Diagram: FileOps Plugin System</text>
  <text x="700" y="50" text-anchor="middle" font-size="11" fill="#666">How MovieRender registers as a FileOps plugin and how FileOps invokes MovieRender plugins</text>

  <!-- ============ LIFELINES ============ -->

  <!-- 1. User / CLI -->
  <rect x="30" y="70" width="110" height="30" rx="5" fill="#fde8e8" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="85" y="90" text-anchor="middle" font-size="10" font-weight="bold">User / CLI</text>
  <line x1="85" y1="100" x2="85" y2="760" stroke="#e74c3c" stroke-width="1" stroke-dasharray="4"/>

  <!-- 2. fileops.export.config -->
  <rect x="180" y="70" width="160" height="30" rx="5" fill="#f0f4ff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="260" y="90" text-anchor="middle" font-size="10" font-weight="bold">fileops.export.config</text>
  <line x1="260" y1="100" x2="260" y2="760" stroke="#2c3e50" stroke-width="1" stroke-dasharray="4"/>

  <!-- 3. fileops plugin registry -->
  <rect x="390" y="70" width="160" height="30" rx="5" fill="#f0f4ff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="470" y="90" text-anchor="middle" font-size="10" font-weight="bold">fileops plugin registry</text>
  <line x1="470" y1="100" x2="470" y2="760" stroke="#2c3e50" stroke-width="1" stroke-dasharray="4"/>

  <!-- 4. MovieHeaderReaderPlugin -->
  <rect x="600" y="70" width="180" height="30" rx="5" fill="#e8e8f8" stroke="#3498db" stroke-width="1.5"/>
  <text x="690" y="90" text-anchor="middle" font-size="10" font-weight="bold">MovieHeaderReaderPlugin</text>
  <line x1="690" y1="100" x2="690" y2="760" stroke="#3498db" stroke-width="1" stroke-dasharray="4"/>

  <!-- 5. LayoutComposer -->
  <rect x="830" y="70" width="170" height="30" rx="5" fill="#f3e8f8" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="915" y="90" text-anchor="middle" font-size="10" font-weight="bold">LayoutComposer</text>
  <line x1="915" y1="100" x2="915" y2="760" stroke="#8e44ad" stroke-width="1" stroke-dasharray="4"/>

  <!-- 6. OverlayPlugin -->
  <rect x="1050" y="70" width="160" height="30" rx="5" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/>
  <text x="1130" y="90" text-anchor="middle" font-size="10" font-weight="bold">OverlayPlugin</text>
  <line x1="1130" y1="100" x2="1130" y2="760" stroke="#f39c12" stroke-width="1" stroke-dasharray="4"/>

  <!-- 7. ConfigMovie (as data object, briefly) -->
  <rect x="1260" y="70" width="120" height="30" rx="5" fill="#e8f4f8" stroke="#2980b9" stroke-width="1.5"/>
  <text x="1320" y="90" text-anchor="middle" font-size="10" font-weight="bold">ConfigMovie</text>
  <line x1="1320" y1="100" x2="1320" y2="760" stroke="#2980b9" stroke-width="1" stroke-dasharray="4"/>

  <!-- ============ PHASE 1: Startup / Plugin Registration ============ -->
  <rect x="20" y="110" width="1360" height="140" rx="5" fill="#f0f4ff" fill-opacity="0.3" stroke="#2c3e50" stroke-width="1" stroke-dasharray="5"/>
  <text x="700" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">Phase 1: Plugin Registration (at import time)</text>

  <!-- Step 1: import movierender triggers plugin loading -->
  <text x="15" y="155" font-weight="bold" fill="#e74c3c">1</text>
  <line x1="85" y1="150" x2="460" y2="150" stroke="#333" stroke-width="1.5" marker-end="url(#a5)"/>
  <text x="272" y="143" text-anchor="middle" font-size="9">import movierender -- loads plugins via entry_points()</text>

  <!-- Step 2: FileOps discovers MovieRender plugins -->
  <text x="15" y="195" font-weight="bold" fill="#e74c3c">2</text>
  <line x1="260" y1="190" x2="460" y2="190" stroke="#333" stroke-width="1.5" marker-end="url(#a5)"/>
  <text x="360" y="183" text-anchor="middle" font-size="9">entry_points(group='fileops.plugins.*')</text>

  <!-- Step 3: Plugins registered in registry -->
  <text x="15" y="235" font-weight="bold" fill="#e74c3c">3</text>
  <rect x="390" y="220" width="160" height="20" rx="3" fill="#f0f4ff" stroke="#2c3e50"/>
  <text x="470" y="233" text-anchor="middle" font-size="9">Store: header_readers[], config_types[]</text>

  <!-- ============ PHASE 2: Config File Parsing ============ -->
  <rect x="20" y="265" width="1360" height="200" rx="5" fill="#f0fff0" fill-opacity="0.3" stroke="#27ae60" stroke-width="1" stroke-dasharray="5"/>
  <text x="700" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Phase 2: Configuration File Parsing</text>

  <!-- Step 4: User invokes CLI -->
  <text x="15" y="310" font-weight="bold" fill="#e74c3c">4</text>
  <rect x="30" y="295" width="110" height="20" rx="3" fill="#fff3e0" stroke="#e67e22"/>
  <text x="85" y="308" text-anchor="middle" font-size="9">$ movierender movie cfg</text>

  <!-- Step 5: CLI calls read_config -->
  <text x="15" y="350" font-weight="bold" fill="#e74c3c">5</text>
  <line x1="85" y1="345" x2="250" y2="345" stroke="#333" stroke-width="1.5" marker-end="url(#a5)"/>
  <text x="167" y="338" text-anchor="middle" font-size="9">read_config(path)</text>

  <!-- Step 6: read_config iterates plugin registry -->
  <text x="15" y="390" font-weight="bold" fill="#e74c3c">6</text>
  <line x1="260" y1="385" x2="460" y2="385" stroke="#333" stroke-width="1.5" marker-end="url(#a5)"/>
  <text x="360" y="378" text-anchor="middle" font-size="9">for plugin in header_reader_plugins:</text>

  <!-- Step 7: Instantiate MovieHeaderReaderPlugin -->
  <text x="15" y="430" font-weight="bold" fill="#e74c3c">7</text>
  <line x1="460" y1="425" x2="680" y2="425" stroke="#3498db" stroke-width="1.5" marker-end="url(#a5)"/>
  <text x="570" y="418" text-anchor="middle" font-size="9">MovieHeaderReaderPlugin(cfg_path)</text>

  <!-- Step 8: has_valid_header() -->
  <text x="15" y="460" font-weight="bold" fill="#e74c3c">8</text>
  <line x1="260" y1="455" x2="680" y2="455" stroke="#3498db" stroke-width="1.5" marker-end="url(#a5)"/>
  <text x="470" y="448" text-anchor="middle" font-size="9">has_valid_header() -- checks for [MOVIE] sections</text>

  <!-- ============ PHASE 3: Config Processing ============ -->
  <rect x="20" y="480" width="1360" height="150" rx="5" fill="#e8f4f8" fill-opacity="0.3" stroke="#2980b9" stroke-width="1" stroke-dasharray="5"/>
  <text x="700" y="500" text-anchor="middle" font-size="12" font-weight="bold" fill="#2980b9">Phase 3: Config Section Processing</text>

  <!-- Step 9: process() -->
  <text x="15" y="530" font-weight="bold" fill="#e74c3c">9</text>
  <line x1="260" y1="525" x2="680" y2="525" stroke="#3498db" stroke-width="1.5" marker-end="url(#a5)"/>
  <text x="470" y="518" text-anchor="middle" font-size="9">process() -- parses [MOVIE] sections</text>

  <!-- Step 10: Plugin reads overlay plugins -->
  <text x="15" y="570" font-weight="bold" fill="#e74c3c">10</text>
  <line x1="680" y1="565" x2="460" y2="565" stroke="#3498db" stroke-width="1.5" marker-end="url(#a5r)"/>
  <text x="570" y="558" text-anchor="middle" font-size="9">query overlay plugins from registry</text>

  <!-- Step 11: Plugin returns ConfigMovie list (as data) -->
  <text x="15" y="610" font-weight="bold" fill="#e74c3c">11</text>
  <line x1="680" y1="605" x2="270" y2="605" stroke="#2980b9" stroke-width="1.5" marker-end="url(#a5r)"/>
  <text x="475" y="598" text-anchor="middle" font-size="9" fill="#2980b9">List[ConfigMovie] -- with overlays, image_file, etc.</text>

  <!-- Step 12: Returns to CLI -->
  <text x="15" y="640" font-weight="bold" fill="#e74c3c">12</text>
  <line x1="250" y1="635" x2="95" y2="635" stroke="#2980b9" stroke-width="1.5" marker-end="url(#a5r)"/>
  <text x="172" y="628" text-anchor="middle" font-size="9" fill="#2980b9">config.movies</text>

  <!-- ============ PHASE 4: Rendering ============ -->
  <rect x="20" y="655" width="1360" height="100" rx="5" fill="#e8f8e8" fill-opacity="0.3" stroke="#27ae60" stroke-width="1" stroke-dasharray="5"/>
  <text x="700" y="675" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Phase 4: Rendering with Overlays</text>

  <!-- Step 13: CLI calls render_movie -->
  <text x="15" y="705" font-weight="bold" fill="#e74c3c">13</text>
  <line x1="85" y1="700" x2="905" y2="700" stroke="#8e44ad" stroke-width="1.5" marker-end="url(#a5)"/>
  <text x="495" y="693" text-anchor="middle" font-size="9">render_movie(configMovie) -- creates LayoutComposer</text>

  <!-- Step 14: LayoutComposer resolves OverlayPlugin -->
  <text x="15" y="745" font-weight="bold" fill="#e74c3c">14</text>
  <line x1="905" y1="740" x2="1120" y2="740" stroke="#f39c12" stroke-width="1.5" marker-end="url(#a5)"/>
  <text x="1012" y="733" text-anchor="middle" font-size="9">ovrl_plugin.overlay -- creates Arrow overlay</text>

  <!-- Step 15: OverlayPlugin creates Overlay instance -->
  <text x="15" y="780" font-weight="bold" fill="#e74c3c">15</text>
  <line x1="1120" y1="775" x2="925" y2="775" stroke="#f39c12" stroke-width="1.5" marker-end="url(#a5r)"/>
  <text x="1022" y="768" text-anchor="middle" font-size="9" fill="#f39c12">Arrow overlay instance</text>

  <!-- ============ LEGEND ============ -->
  <rect x="30" y="130" width="300" height="120" rx="5" fill="#f9f9f9" stroke="#ccc" stroke-width="1"/>
  <text x="40" y="148" font-weight="bold" font-size="11">Legend</text>
  <rect x="40" y="158" width="120" height="15" rx="3" fill="#f0f4ff" fill-opacity="0.5" stroke="#2c3e50" stroke-dasharray="5"/>
  <text x="170" y="170" font-size="9">FileOps domain</text>
  <rect x="40" y="178" width="120" height="15" rx="3" fill="#e8f8e8" fill-opacity="0.5" stroke="#27ae60" stroke-dasharray="5"/>
  <text x="170" y="190" font-size="9">MovieRender domain</text>
  <line x1="40" y1="205" x2="100" y2="205" stroke="#333" stroke-width="1.5" marker-end="url(#a5)"/>
  <text x="110" y="209" font-size="9">Call</text>
  <line x1="180" y1="205" x2="240" y2="205" stroke="#2980b9" stroke-width="1.5" marker-end="url(#a5r)"/>
  <text x="250" y="209" font-size="9">Return</text>
  <rect x="40" y="220" width="15" height="10" rx="2" fill="#fff3e0" stroke="#e67e22"/>
  <text x="65" y="229" font-size="9">User action</text>
</svg>