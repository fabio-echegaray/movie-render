<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 750" font-family="monospace" font-size="12">
  <defs>
    <marker id="a4" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="a4r" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="700" y="30" text-anchor="middle" font-size="18" font-weight="bold">Communication Diagram: Panel Rendering Flow</text>
  <text x="700" y="50" text-anchor="middle" font-size="11" fill="#666">Sequence of interactions when rendering a static panel (PDF) from a .cfg file</text>

  <!-- ============ LIFELINES ============ -->

  <!-- 1. CLI -->
  <rect x="50" y="70" width="120" height="30" rx="5" fill="#fde8e8" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="110" y="90" text-anchor="middle" font-size="10" font-weight="bold">CLI (Typer)</text>
  <line x1="110" y1="100" x2="110" y2="710" stroke="#e74c3c" stroke-width="1" stroke-dasharray="4"/>

  <!-- 2. fileops.read_config -->
  <rect x="230" y="70" width="150" height="30" rx="5" fill="#f0f4ff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="305" y="90" text-anchor="middle" font-size="10" font-weight="bold">fileops.read_config</text>
  <line x1="305" y1="100" x2="305" y2="710" stroke="#2c3e50" stroke-width="1" stroke-dasharray="4"/>

  <!-- 3. PanelHeaderReaderPlugin -->
  <rect x="430" y="70" width="190" height="30" rx="5" fill="#e8e8f8" stroke="#3498db" stroke-width="1.5"/>
  <text x="525" y="90" text-anchor="middle" font-size="10" font-weight="bold">PanelHeaderReaderPlugin</text>
  <line x1="525" y1="100" x2="525" y2="710" stroke="#3498db" stroke-width="1" stroke-dasharray="4"/>

  <!-- 4. render_static_montage -->
  <rect x="680" y="70" width="180" height="30" rx="5" fill="#f3e8f8" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="770" y="90" text-anchor="middle" font-size="10" font-weight="bold">render_static_montage</text>
  <line x1="770" y1="100" x2="770" y2="710" stroke="#8e44ad" stroke-width="1" stroke-dasharray="4"/>

  <!-- 5. Seaborn FacetGrid -->
  <rect x="910" y="70" width="160" height="30" rx="5" fill="#fff8e1" stroke="#f39c12" stroke-width="1.5"/>
  <text x="990" y="90" text-anchor="middle" font-size="10" font-weight="bold">sns.FacetGrid</text>
  <line x1="990" y1="100" x2="990" y2="710" stroke="#f39c12" stroke-width="1" stroke-dasharray="4"/>

  <!-- 6. plotimg function -->
  <rect x="1120" y="70" width="160" height="30" rx="5" fill="#e8f8e8" stroke="#27ae60" stroke-width="1.5"/>
  <text x="1200" y="90" text-anchor="middle" font-size="10" font-weight="bold">plotimg()</text>
  <line x1="1200" y1="100" x2="1200" y2="710" stroke="#27ae60" stroke-width="1" stroke-dasharray="4"/>

  <!-- ============ MESSAGES ============ -->

  <!-- Step 1: CLI invocation -->
  <text x="15" y="135" font-weight="bold" fill="#e74c3c">1</text>
  <rect x="40" y="120" width="140" height="25" rx="3" fill="#fff3e0" stroke="#e67e22"/>
  <text x="110" y="137" text-anchor="middle" font-size="9">$ movierender panel cfg</text>

  <!-- Step 2: read_config -->
  <text x="15" y="180" font-weight="bold" fill="#e74c3c">2</text>
  <line x1="110" y1="175" x2="295" y2="175" stroke="#333" stroke-width="1.5" marker-end="url(#a4)"/>
  <text x="202" y="168" text-anchor="middle" font-size="9">read_config(cfg_path)</text>

  <!-- Step 3: Plugin processes PANEL sections -->
  <text x="15" y="225" font-weight="bold" fill="#e74c3c">3</text>
  <line x1="305" y1="220" x2="515" y2="220" stroke="#333" stroke-width="1.5" marker-end="url(#a4)"/>
  <text x="410" y="213" text-anchor="middle" font-size="9">has_valid_header()</text>

  <!-- Step 4: process() -->
  <text x="15" y="265" font-weight="bold" fill="#e74c3c">4</text>
  <line x1="305" y1="260" x2="515" y2="260" stroke="#333" stroke-width="1.5" marker-end="url(#a4)"/>
  <text x="410" y="253" text-anchor="middle" font-size="9">process() -- parse PANEL sections</text>

  <!-- Step 5: returns ConfigPanel (as data) -->
  <text x="15" y="305" font-weight="bold" fill="#e74c3c">5</text>
  <line x1="515" y1="300" x2="315" y2="300" stroke="#2980b9" stroke-width="1.5" marker-end="url(#a4r)"/>
  <text x="415" y="293" text-anchor="middle" font-size="9" fill="#2980b9">List[ConfigPanel]</text>

  <!-- Step 6: returns to CLI -->
  <text x="15" y="345" font-weight="bold" fill="#e74c3c">6</text>
  <line x1="295" y1="340" x2="120" y2="340" stroke="#2980b9" stroke-width="1.5" marker-end="url(#a4r)"/>
  <text x="207" y="333" text-anchor="middle" font-size="9" fill="#2980b9">config.panels</text>

  <!-- Step 7: CLI calls render_static_montage -->
  <text x="15" y="390" font-weight="bold" fill="#e74c3c">7</text>
  <line x1="110" y1="385" x2="760" y2="385" stroke="#8e44ad" stroke-width="1.5" marker-end="url(#a4)"/>
  <text x="435" y="378" text-anchor="middle" font-size="9">render_static_montage(panel, copyright)</text>

  <!-- Step 8: Creates DataFrame of images -->
  <text x="15" y="435" font-weight="bold" fill="#e74c3c">8</text>
  <rect x="680" y="420" width="180" height="20" rx="3" fill="#f3e8f8" stroke="#8e44ad"/>
  <text x="770" y="433" text-anchor="middle" font-size="9">Create image DataFrame (ch, z, frame)</text>

  <!-- Step 9: Select layout type -->
  <text x="15" y="475" font-weight="bold" fill="#e74c3c">9</text>
  <rect x="680" y="460" width="180" height="20" rx="3" fill="#f3e8f8" stroke="#8e44ad"/>
  <text x="770" y="473" text-anchor="middle" font-size="9">if layout == "time-array" or "z-array"</text>

  <!-- Step 10: Create FacetGrid -->
  <text x="15" y="520" font-weight="bold" fill="#e74c3c">10</text>
  <line x1="770" y1="515" x2="980" y2="515" stroke="#f39c12" stroke-width="1.5" marker-end="url(#a4)"/>
  <text x="875" y="508" text-anchor="middle" font-size="9">sns.FacetGrid(im_df, row, col)</text>

  <!-- Step 11: map_dataframe calls plotimg -->
  <text x="15" y="565" font-weight="bold" fill="#e74c3c">11</text>
  <line x1="980" y1="560" x2="1190" y2="560" stroke="#27ae60" stroke-width="1.5" marker-end="url(#a4)"/>
  <text x="1085" y="553" text-anchor="middle" font-size="9">g.map_dataframe(plotimg, panel)</text>

  <!-- Step 12: plotimg loads image via ImageFile -->
  <text x="15" y="610" font-weight="bold" fill="#e74c3c">12</text>
  <rect x="1120" y="595" width="160" height="20" rx="3" fill="#e8f8e8" stroke="#27ae60"/>
  <text x="1200" y="608" text-anchor="middle" font-size="9">imf.image(ix) via FileOps</text>

  <!-- Step 13: plotimg creates overlays -->
  <text x="15" y="650" font-weight="bold" fill="#e74c3c">13</text>
  <rect x="1120" y="635" width="160" height="20" rx="3" fill="#e8f8e8" stroke="#27ae60"/>
  <text x="1200" y="648" text-anchor="middle" font-size="9">ScaleBar.plot(), Timestamp.plot()</text>

  <!-- Step 14: plotimg renders to axes -->
  <text x="15" y="690" font-weight="bold" fill="#e74c3c">14</text>
  <rect x="1120" y="675" width="160" height="20" rx="3" fill="#e8f8e8" stroke="#27ae60"/>
  <text x="1200" y="688" text-anchor="middle" font-size="9">ax.imshow(img) + overlay.plot()</text>

  <!-- Step 15: FacetGrid saves PDF -->
  <text x="15" y="720" font-weight="bold" fill="#e74c3c">15</text>
  <line x1="980" y1="715" x2="780" y2="715" stroke="#8e44ad" stroke-width="1.5" marker-end="url(#a4r)"/>
  <text x="880" y="708" text-anchor="middle" font-size="9">g.savefig(filepath) or pdf.savefig()</text>

  <!-- Step 16: Returns file path -->
  <text x="15" y="750" font-weight="bold" fill="#e74c3c">16</text>
  <line x1="760" y1="745" x2="120" y2="745" stroke="#2980b9" stroke-width="1.5" marker-end="url(#a4r)"/>
  <text x="440" y="738" text-anchor="middle" font-size="9" fill="#2980b9">return filepath</text>

  <!-- ============ LEGEND ============ -->
  <rect x="30" y="570" width="280" height="100" rx="5" fill="#f9f9f9" stroke="#ccc" stroke-width="1"/>
  <text x="40" y="588" font-weight="bold" font-size="11">Legend</text>
  <line x1="40" y1="605" x2="100" y2="605" stroke="#333" stroke-width="1.5" marker-end="url(#a4)"/>
  <text x="110" y="609" font-size="9">Call</text>
  <line x1="40" y1="625" x2="100" y2="625" stroke="#2980b9" stroke-width="1.5" marker-end="url(#a4r)"/>
  <text x="110" y="629" font-size="9">Return</text>
  <line x1="40" y1="645" x2="100" y2="645" stroke="#333" stroke-width="1" stroke-dasharray="4"/>
  <text x="110" y="649" font-size="9">Lifeline</text>
  <rect x="180" y="600" width="15" height="10" rx="2" fill="#fff3e0" stroke="#e67e22"/>
  <text x="205" y="609" font-size="9">User action</text>
  <rect x="180" y="620" width="15" height="10" rx="2" fill="#f3e8f8" stroke="#8e44ad"/>
  <text x="205" y="629" font-size="9">Internal</text>
</svg>